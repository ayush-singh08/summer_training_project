name: StreamFlix CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build:
    name: Build and Push StreamFlix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          VITE_APP_API_ENDPOINT_URL: https://api.themoviedb.org/3
          VITE_APP_TMDB_V3_API_KEY: ${{ secrets.TMDB_V3_API_KEY }}

      - name: Build Docker image
        run: |
          docker build \
            --build-arg TMDB_V3_API_KEY=${{ secrets.TMDB_V3_API_KEY }} \
            -t streamflix:${{ github.sha }} .

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to Azure Container Registry
        run: az acr login --name streamflix

      - name: Tag Docker image
        run: |
          docker tag \
            streamflix:${{ github.sha }} \
            streamflix.azurecr.io/streamflix:${{ github.sha }}

      - name: Push Docker image to ACR
        run: |
          docker push \
            streamflix.azurecr.io/streamflix:${{ github.sha }}

  deploy-vm1:
    name: Deploy to VM 1
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to VM 1
        run: |
          az vm run-command invoke \
            --resource-group streamflix-rg \
            --name streamflix-vm-1 \
            --command-id RunShellScript \
            --scripts '
              set -e

              az login --identity

              az acr login --name streamflix

              docker pull streamflix.azurecr.io/streamflix:${{ github.sha }}

              docker stop streamflix || true
              docker rm streamflix || true

              docker run -d \
                --name streamflix \
                --restart unless-stopped \
                -p 80:80 \
                streamflix.azurecr.io/streamflix:${{ github.sha }}

              docker image prune -f
            '

  deploy-vm2:
    name: Deploy to VM 2
    needs: deploy-vm1
    runs-on: ubuntu-latest

    steps:
      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to VM 2
        run: |
          az vm run-command invoke \
            --resource-group streamflix-rg \
            --name streamflix-vm-2 \
            --command-id RunShellScript \
            --scripts '
              set -e

              az login --identity

              az acr login --name streamflix

              docker pull streamflix.azurecr.io/streamflix:${{ github.sha }}

              docker stop streamflix || true
              docker rm streamflix || true

              docker run -d \
                --name streamflix \
                --restart unless-stopped \
                -p 80:80 \
                streamflix.azurecr.io/streamflix:${{ github.sha }}

              docker image prune -f
            '