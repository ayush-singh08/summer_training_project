name: StreamFlix CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build StreamFlix
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          VITE_APP_API_ENDPOINT_URL: https://api.themoviedb.org/3
          VITE_APP_TMDB_V3_API_KEY: ${{ secrets.TMDB_V3_API_KEY }}

      - name: Build Docker image
        run: |
          docker build \
            --build-arg TMDB_V3_API_KEY=${{ secrets.TMDB_V3_API_KEY }} \
            -t streamflix:${{ github.sha }} .